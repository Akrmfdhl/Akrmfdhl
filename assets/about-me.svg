<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#111520" />
    </linearGradient>

    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2030" />
      <stop offset="100%" stop-color="#121622" />
    </linearGradient>

    <linearGradient id="quotePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161C28" />
      <stop offset="100%" stop-color="#0F131C" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="softOuter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#080B11" flood-opacity="0.9" />
      <feDropShadow dx="-6" dy="-6" stdDeviation="10" flood-color="#242C3D" flood-opacity="0.45" />
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="4.5" flood-color="#07090F" flood-opacity="0.85" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="3.5" flood-color="#242F42" flood-opacity="0.55" />
    </filter>

    <filter id="recessedShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#06080E" flood-opacity="0.9" />
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="#1E2738" flood-opacity="0.35" />
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, sans-serif; }
      .title { font-size: 11px; font-weight: 700; fill: #64748B; letter-spacing: 1.2px; }
      .tile-header { font-size: 13px; font-weight: 700; fill: #F1F5F9; letter-spacing: -0.2px; }
      .tile-body { font-size: 11.5px; font-weight: 400; fill: #94A3B8; line-height: 1.5; }
    </style>
  </defs>

  <rect x="16" y="14" width="888" height="252" rx="20" fill="url(#cardBg)" filter="url(#softOuter)" stroke="#1F2839" stroke-width="1.2" />

  <g transform="translate(48, 38)">
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="sans title">ENGINEERING PROFILE &amp; FOCUS</text>
    </g>

    <g transform="translate(0, 30)">
      <g transform="translate(0, 0)">
        <rect width="258" height="116" rx="14" fill="url(#tileBg)" filter="url(#tileShadow)" stroke="#222B3D" stroke-width="1" />
        <circle cx="22" cy="24" r="4" fill="#38BDF8" />
        <text x="34" y="28" class="sans tile-header">Architecture</text>
        <text x="22" y="54" class="sans tile-body">Designing decoupled, scalable</text>
        <text x="22" y="72" class="sans tile-body">full-stack web systems and</text>
        <text x="22" y="90" class="sans tile-body">high-throughput microservices.</text>
      </g>

      <g transform="translate(283, 0)">
        <rect width="258" height="116" rx="14" fill="url(#tileBg)" filter="url(#tileShadow)" stroke="#222B3D" stroke-width="1" />
        <circle cx="22" cy="24" r="4" fill="#34D399" />
        <text x="34" y="28" class="sans tile-header">Craftsmanship</text>
        <text x="22" y="54" class="sans tile-body">Pixel-perfect user interfaces,</text>
        <text x="22" y="72" class="sans tile-body">fluid micro-interactions, and</text>
        <text x="22" y="90" class="sans tile-body">zero-defect frontend execution.</text>
      </g>

      <g transform="translate(566, 0)">
        <rect width="258" height="116" rx="14" fill="url(#tileBg)" filter="url(#tileShadow)" stroke="#222B3D" stroke-width="1" />
        <circle cx="22" cy="24" r="4" fill="#818CF8" />
        <text x="34" y="28" class="sans tile-header">Performance</text>
        <text x="22" y="54" class="sans tile-body">Optimizing database queries,</text>
        <text x="22" y="72" class="sans tile-body">eliminating bottlenecks, and</text>
        <text x="22" y="90" class="sans tile-body">delivering blazing fast runtime.</text>
      </g>
    </g>

    <g transform="translate(0, 166)">
      <rect width="824" height="42" rx="12" fill="url(#quotePlate)" filter="url(#recessedShadow)" stroke="#1C2332" stroke-width="0.8" />
      <text x="24" y="26" fill="#38BDF8" font-size="14" font-weight="700" class="sans">“</text>
      <text x="38" y="26" fill="#CBD5E1" font-size="12.5" font-style="italic" font-weight="500" class="sans">
        Simplicity is prerequisite for reliability.
      </text>
      <text x="800" y="26" text-anchor="end" fill="#64748B" font-size="11.5" font-weight="600" class="sans">
        — Edsger W. Dijkstra
      </text>
    </g>
  </g>
</svg>
