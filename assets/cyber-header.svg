<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#0D131B" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4" />
    </linearGradient>
    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.2" />

  <g transform="translate(32, 42)">
    <text x="0" y="32" fill="#FFFFFF" font-size="30" font-weight="700" letter-spacing="-0.5" class="font-sans">Akrom Fadhil</text>
    <text x="210" y="30" fill="#64748B" font-size="16" font-weight="500" class="font-mono">(@Akrmfdhl)</text>
    
    <text x="0" y="64" fill="url(#textGrad)" font-size="16" font-weight="600" class="font-sans">
      Full Stack Software Engineer
    </text>
    <text x="0" y="90" fill="#94A3B8" font-size="13.5" class="font-sans">
      Building scalable web applications, clean backend APIs, and modern developer tooling.
    </text>
  </g>

  <g transform="translate(32, 160)">
    <g transform="translate(0, 0)">
      <rect width="268" height="50" rx="8" fill="url(#cardGlow)" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="20" fill="#64748B" font-size="10" font-weight="600" class="font-mono">DOMAIN</text>
      <text x="16" y="37" fill="#E2E8F0" font-size="12" font-weight="500" class="font-sans">Web &amp; Backend Development</text>
    </g>

    <g transform="translate(284, 0)">
      <rect width="268" height="50" rx="8" fill="url(#cardGlow)" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="20" fill="#64748B" font-size="10" font-weight="600" class="font-mono">STACK</text>
      <text x="16" y="37" fill="#E2E8F0" font-size="12" font-weight="500" class="font-sans">TypeScript, React, Node.js, Go</text>
    </g>

    <g transform="translate(568, 0)">
      <rect width="268" height="50" rx="8" fill="url(#cardGlow)" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="20" fill="#64748B" font-size="10" font-weight="600" class="font-mono">LOCATION</text>
      <text x="16" y="37" fill="#E2E8F0" font-size="12" font-weight="500" class="font-sans">Indonesia (UTC+7)</text>
    </g>
