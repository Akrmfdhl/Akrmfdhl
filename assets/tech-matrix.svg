        <rect x="83" y="0" width="75" height="26" rx="6" fill="url(#badgeGrad)" stroke="#94A3B8" stroke-width="0.8" />
        <text x="120" y="17" text-anchor="middle" class="pill-text" fill="#F1F5F9">Express</text>

        <rect x="166" y="0" width="75" height="26" rx="6" fill="url(#badgeGrad)" stroke="#059669" stroke-width="0.8" />
        <text x="203" y="17" text-anchor="middle" class="pill-text" fill="#34D399">FastAPI</text>

        <rect x="249" y="0" width="95" height="26" rx="6" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="0.8" />
        <text x="296" y="17" text-anchor="middle" class="pill-text" fill="#38BDF8">PostgreSQL</text>

        <rect x="352" y="0" width="60" height="26" rx="6" fill="url(#badgeGrad)" stroke="#EF4444" stroke-width="0.8" />
        <text x="382" y="17" text-anchor="middle" class="pill-text" fill="#F87171">Redis</text>

        <rect x="420" y="0" width="70" height="26" rx="6" fill="url(#badgeGrad)" stroke="#22D3EE" stroke-width="0.8" />
        <text x="455" y="17" text-anchor="middle" class="pill-text" fill="#22D3EE">Docker</text>

        <rect x="498" y="0" width="50" height="26" rx="6" fill="url(#badgeGrad)" stroke="#FB923C" stroke-width="0.8" />
        <text x="523" y="17" text-anchor="middle" class="pill-text" fill="#FB923C">Git</text>

        <rect x="556" y="0" width="60" height="26" rx="6" fill="url(#badgeGrad)" stroke="#F1F5F9" stroke-width="0.8" />
        <text x="586" y="17" text-anchor="middle" class="pill-text" fill="#F1F5F9">Linux</text>

        <rect x="624" y="0" width="75" height="26" rx="6" fill="url(#badgeGrad)" stroke="#FB923C" stroke-width="0.8" />
        <text x="661" y="17" text-anchor="middle" class="pill-text" fill="#FB923C">Postman</text>
