        <rect x="103" y="0" width="95" height="26" rx="6" fill="url(#badgeGrad)" stroke="#FACC15" stroke-width="0.8" />
        <text x="150" y="17" text-anchor="middle" class="pill-text" fill="#FACC15">JavaScript</text>

        <rect x="206" y="0" width="75" height="26" rx="6" fill="url(#badgeGrad)" stroke="#34D399" stroke-width="0.8" />
        <text x="243" y="17" text-anchor="middle" class="pill-text" fill="#34D399">Python</text>

        <rect x="289" y="0" width="95" height="26" rx="6" fill="url(#badgeGrad)" stroke="#00ADD8" stroke-width="0.8" />
        <text x="336" y="17" text-anchor="middle" class="pill-text" fill="#00ADD8">Go (Golang)</text>

        <rect x="392" y="0" width="60" height="26" rx="6" fill="url(#badgeGrad)" stroke="#818CF8" stroke-width="0.8" />
        <text x="422" y="17" text-anchor="middle" class="pill-text" fill="#818CF8">PHP</text>

        <rect x="460" y="0" width="55" height="26" rx="6" fill="url(#badgeGrad)" stroke="#F43F5E" stroke-width="0.8" />
        <text x="487" y="17" text-anchor="middle" class="pill-text" fill="#F43F5E">SQL</text>

        <rect x="523" y="0" width="95" height="26" rx="6" fill="url(#badgeGrad)" stroke="#FB923C" stroke-width="0.8" />
        <text x="570" y="17" text-anchor="middle" class="pill-text" fill="#FB923C">HTML5 / CSS3</text>
