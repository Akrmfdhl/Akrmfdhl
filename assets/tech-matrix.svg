        <text x="75" y="17" text-anchor="middle" class="pill-text" fill="#C084FC">Multi-Agent Systems</text>

        <rect x="158" y="0" width="130" height="26" rx="6" fill="url(#badgeGrad)" stroke="#60A5FA" stroke-width="0.8" />
        <text x="223" y="17" text-anchor="middle" class="pill-text" fill="#93C5FD">Gemini SDK / ADK</text>

        <rect x="296" y="0" width="165" height="26" rx="6" fill="url(#badgeGrad)" stroke="#818CF8" stroke-width="0.8" />
        <text x="378" y="17" text-anchor="middle" class="pill-text" fill="#A5B4FC">Local LLMs (LM Studio)</text>

        <rect x="469" y="0" width="95" height="26" rx="6" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="0.8" />
