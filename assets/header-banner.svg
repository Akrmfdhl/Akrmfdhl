<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060606" />
      <stop offset="35%" stop-color="#121212" />
      <stop offset="65%" stop-color="#080808" />
      <stop offset="100%" stop-color="#0E0E0E" />
    </linearGradient>

    <linearGradient id="obsidianCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0A0A0A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="metalSpecular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#666666" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#666666" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="subtleSheen" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="920" height="220" rx="16" fill="url(#obsidianBase)" stroke="#222222" stroke-width="1.2" />
  <rect width="920" height="220" rx="16" fill="url(#subtleSheen)" />
  <rect x="0" y="0" width="920" height="1.8" fill="url(#metalSpecular)" />

  <g transform="translate(48, 48)">
    <text x="0" y="32" fill="#FFFFFF" font-size="34" font-weight="750" letter-spacing="-0.6" class="sans">
      Akrom Fadhil
    </text>

    <text x="0" y="62" fill="#D4D4D4" font-size="15.5" font-weight="600" class="sans" letter-spacing="0.2">
      Full Stack Software Engineer
    </text>

    <text x="0" y="86" fill="#888888" font-size="13" font-weight="400" class="sans">
      Building scalable web systems, resilient backend architectures, and high-performance digital products.
    </text>
  </g>

  <g transform="translate(48, 154)">
    <g transform="translate(0, 0)">
      <rect width="260" height="44" rx="10" fill="url(#obsidianCard)" stroke="#262626" stroke-width="1" />
      <text x="16" y="17" fill="#666666" font-size="9.5" font-weight="600" class="sans" letter-spacing="0.6">SPECIALIZATION</text>
      <text x="16" y="32" fill="#EDEDED" font-size="11.5" font-weight="500" class="sans">Full Stack Engineering</text>
    </g>

    <g transform="translate(282, 0)">
      <rect width="260" height="44" rx="10" fill="url(#obsidianCard)" stroke="#262626" stroke-width="1" />
      <text x="16" y="17" fill="#666666" font-size="9.5" font-weight="600" class="sans" letter-spacing="0.6">CORE TECHNOLOGIES</text>
      <text x="16" y="32" fill="#EDEDED" font-size="11.5" font-weight="500" class="sans">TypeScript, Go, React, Node.js</text>
    </g>

    <g transform="translate(564, 0)">
      <rect width="260" height="44" rx="10" fill="url(#obsidianCard)" stroke="#262626" stroke-width="1" />
      <text x="16" y="17" fill="#666666" font-size="9.5" font-weight="600" class="sans" letter-spacing="0.6">LOCATION &amp; TIMEZONE</text>
      <text x="16" y="32" fill="#EDEDED" font-size="11.5" font-weight="500" class="sans">Indonesia (UTC+7)</text>
    </g>
  </g>
</svg>
