<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#111520" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2030" />
      <stop offset="100%" stop-color="#121622" />
    </linearGradient>

    <filter id="softOuter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#080B11" flood-opacity="0.9" />
      <feDropShadow dx="-6" dy="-6" stdDeviation="10" flood-color="#242C3D" flood-opacity="0.45" />
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3.5" flood-color="#07090F" flood-opacity="0.8" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="2.5" flood-color="#232D40" flood-opacity="0.5" />
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, sans-serif; }
      .label { font-size: 11px; font-weight: 700; fill: #64748B; letter-spacing: 0.8px; }
      .headline { font-size: 13.5px; font-weight: 600; fill: #F1F5F9; }
    </style>
  </defs>

  <rect x="16" y="14" width="888" height="82" rx="18" fill="url(#footerBg)" filter="url(#softOuter)" stroke="#1F2839" stroke-width="1.2" />

  <g transform="translate(48, 40)">
    <g transform="translate(0, 0)">
      <circle cx="8" cy="15" r="4.5" fill="#34D399" />
      <text x="24" y="10" class="sans label">STATUS</text>
      <text x="24" y="27" class="sans headline">Designing, building, and deploying scalable software daily.</text>
    </g>

    <g transform="translate(610, 2)">
      <rect width="214" height="38" rx="10" fill="url(#pillGrad)" filter="url(#tileShadow)" stroke="#222B3D" stroke-width="1" />
      <circle cx="20" cy="19" r="3.5" fill="#38BDF8" />
      <text x="34" y="23.5" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">Open to Collaboration</text>
    </g>
  </g>
</svg>
